name: publish

on:
  push:
    tags:
      - 'app@*'
      - 'cli@*'
      - 'core@*'
      - 'v*'
jobs:
  npm:
    # prevents this action from running on forks
    # modify from https://github.com/vitejs/vite/blob/main/.github/workflows/publish.yml
    if: github.repository == 'likun7981/hlink'
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node version to 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify npm authentication
        # setup-node configures npm to read NODE_AUTH_TOKEN at runtime.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is missing. Add it to the GitHub Release environment secrets."
            exit 1
          fi
          if ! npm whoami --registry=https://registry.npmjs.org/; then
            echo "::error::Cannot authenticate to npm. Check registry connectivity and the NPM_TOKEN secret in the GitHub Release environment; use a valid granular npm access token."
            exit 1
          fi
          echo "npm authentication passed. Publishing also requires package write access to @hlink/core, @hlink/app and hlink, plus permission for noninteractive publishing."

      - name: Publish package
        run: pnpm run ci-publish -- ${{ github.ref_name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          platforms: |
            linux/amd64
            linux/arm64/v8
          tags: likun7981/hlink:latest,likun7981/hlink:${{ github.ref_name }}
